name: "📅 Týdenní aktualizace"

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions plánuje v UTC. V létě je pondělí 04:37 UTC = 06:37 v Praze.
    # Po přechodu na zimní čas posuneme cron na 05:37 UTC.
    # Týdenní sync je posunutý oproti dennímu, aby se workflow nepotkala.
    - cron: "37 4 * * 1"

permissions:
  contents: write

concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "Aktualizovat týdenní zdroje"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "Načíst repozitář"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Nastavit Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: "Nainstalovat závislosti"
        run: npm ci

      - name: "Nainstalovat Chrome pro datový sync"
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: "Nainstalovat podporu starých grantových formátů"
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check xlrd==2.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword catdoc

      - name: "Ověřit syntaxi grantových importérů"
        run: |
          python3 -m py_compile \
            scripts/sync-grants.py \
            scripts/sync-grants-current-safe.py \
            scripts/sync-grants-history.py \
            scripts/sync-grants-social-modern.py \
            scripts/sync-grants-resolution-programs.py \
            scripts/sync-grants-archive.py \
            scripts/sync-grants-archive-social-legacy.py \
            scripts/sync-grants-sport-legacy.py \
            scripts/sync-grants-archive-culture.py \
            scripts/sync-grants-individual.py \
            scripts/normalize-extraordinary-grant-recipients.py \
            scripts/normalize-grant-recipients.py \
            scripts/validate-grants.py \
            scripts/update-grants-source-status.py

      - name: "Spustit týdenní synchronizaci"
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:weekly

      - name: "Aktualizovat dotace a granty"
        run: npm run sync:grants

      - name: "Ověřit dotace v Datových zdrojích"
        run: |
          python3 - <<'PY'
          import json
          grants=json.load(open('data/dotace.json',encoding='utf-8'))
          status=json.load(open('data/source-status.json',encoding='utf-8'))
          count=int(grants.get('meta',{}).get('records') or len(grants.get('grants') or []))
          s=status.get('grants') or {}
          assert s.get('status')=='data načtena'
          assert s.get('mode')=='aktualizováno'
          assert int(s.get('count') or 0)==count
          assert s.get('updated')
          print(f'Dotace a granty: {count} záznamů · aktualizováno {s.get("updated")}')
          PY

      - name: "Ověřit JSON datasety"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = 'data';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          if (!files.length) throw new Error('Ve složce data nejsou žádné JSON datasety.');
          for (const file of files) {
            const full = path.join(dir, file);
            const text = fs.readFileSync(full, 'utf8');
            if (!text.trim()) throw new Error(`${file} je prázdný.`);
            JSON.parse(text);
          }
          console.log(`OK: ověřeno ${files.length} JSON datasetů.`);
          NODE

      - name: "Zjistit změny"
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: "Uložit aktualizovaná data"
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Týdenní aktualizace dat"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: "Souhrn"
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "## ❌ Týdenní aktualizace selhala" >> "$GITHUB_STEP_SUMMARY"
            echo "Existující data v repozitáři nebyla nahrazena neúspěšným během." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## ✅ Týdenní aktualizace dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Běžné týdenní zdroje i dotace a granty byly zkontrolovány a uloženy v jednom společném běhu." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Týdenní kontrola dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Běžné týdenní zdroje i dotace a granty prošly kontrolou; nebylo co měnit." >> "$GITHUB_STEP_SUMMARY"
          fi
