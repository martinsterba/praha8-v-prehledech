name: "📅 Týdenní aktualizace"

on:
  workflow_dispatch:
  schedule:
    # Stabilní UTC plán bez timezone vrstvy.
    # Dva kandidátní časy pokryjí CET i CEST; job si ověří, že je v Praze 06:xx.
    # Pondělí 06:17 Praha = 04:17 UTC v létě / 05:17 UTC v zimě.
    - cron: "17 4 * * 1"
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "Aktualizovat týdenní zdroje"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Ověřit čas v Praze"
        id: prague_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ruční spuštění: synchronizace poběží bez časové kontroly."
            exit 0
          fi
          PRAGUE_HOUR="$(TZ=Europe/Prague date +%H)"
          PRAGUE_NOW="$(TZ=Europe/Prague date '+%d. %m. %Y %H:%M %Z')"
          echo "Praha: $PRAGUE_NOW"
          if [ "$PRAGUE_HOUR" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Je 06:xx v Praze: synchronizace poběží."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Tento záložní UTC běh není 06:xx v Praze: synchronizace se přeskočí."
          fi

      - name: "Načíst repozitář"
        if: steps.prague_time.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Nastavit Node.js"
        if: steps.prague_time.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: "Nainstalovat závislosti"
        if: steps.prague_time.outputs.run == 'true'
        run: npm ci

      - name: "Nainstalovat Chrome pro datový sync"
        if: steps.prague_time.outputs.run == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: "Spustit týdenní synchronizaci"
        if: steps.prague_time.outputs.run == 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:weekly

      - name: "Ověřit JSON datasety"
        if: steps.prague_time.outputs.run == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = 'data';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          if (!files.length) throw new Error('Ve složce data nejsou žádné JSON datasety.');
          for (const file of files) {
            const full = path.join(dir, file);
            const text = fs.readFileSync(full, 'utf8');
            if (!text.trim()) throw new Error(`${file} je prázdný.`);
            JSON.parse(text);
          }
          console.log(`OK: ověřeno ${files.length} JSON datasetů.`);
          NODE

      - name: "Zjistit změny"
        if: steps.prague_time.outputs.run == 'true'
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Uložit aktualizovaná data"
        if: steps.prague_time.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Týdenní aktualizace dat"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: "Souhrn"
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.prague_time.outputs.run }}" != "true" ]; then
            echo "## ⏭️ Záložní UTC běh přeskočen" >> "$GITHUB_STEP_SUMMARY"
            echo "V okamžiku spuštění nebylo v Praze 06:xx; data se správně nesynchronizovala podruhé." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" != "success" ]; then
            echo "## ❌ Týdenní aktualizace selhala" >> "$GITHUB_STEP_SUMMARY"
            echo "Existující data v repozitáři nebyla nahrazena neúspěšným během." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## ✅ Týdenní aktualizace dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Změněné datasety byly zkontrolovány a uloženy do repozitáře." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Týdenní kontrola dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Ve sledovaných datech nebyly nalezeny žádné změny." >> "$GITHUB_STEP_SUMMARY"
          fi
