name: "🛠️ Dotace – oprava parseru 2021"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-parser-hotfix.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Opravit volbu sloupce schválené částky
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync-grants-history.py')
          s=p.read_text(encoding='utf-8')
          old="['schválen','schvalen','přidělen','pridelen','částka','castka','dotace','výše','vyse','návrh dk','navrh dk']"
          new="['schválen','schvalen','přidělen','pridelen','částka','castka','výše','vyse','návrh dk','navrh dk']"
          if old not in s: raise SystemExit('Cílový řetězec parseru nenalezen')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/sync-grants-history.py
      - name: Uložit opravu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-grants-history.py
          git commit -m "Prefer explicit approved amount headers"
          git pull --rebase origin main
          git push origin HEAD:main
