name: "Ověřit povolební role 2026"
# retest po opravě párování ZHMP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-postelection-roles.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Aktualizovat funkce HMP
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:hmp-functions
      - name: Aktualizovat orgány Prahy 8
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:bodies
      - name: Ověřit výsledný stav
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const people=JSON.parse(fs.readFileSync('data/lide.json','utf8'));
          const bodies=JSON.parse(fs.readFileSync('data/organy.json','utf8'));
          const hmp=people.filter(p=>(p.magistrateRoles||[]).some(r=>/zastupitel hl\. města Prahy/i.test(r.role)));
          const expected=['Gros Ondřej','Hřebík Tomáš','Nepil Radomír','Novotná Hana','Slabihoudek Tomáš'];
          for(const n of expected) if(!hmp.some(p=>p.name.includes(n))) throw new Error('Chybí zastupitel HMP: '+n);
          if(hmp.length!==5) throw new Error('Očekáváno 5 zastupitelů HMP z Prahy 8, nalezeno '+hmp.length);
          const stale=people.flatMap(p=>(p.magistrateRoles||[]).map(r=>({name:p.name,...r}))).filter(r=>/výbor|komise|povodňová/i.test((r.body||'')+' '+(r.role||'')));
          if(stale.length) throw new Error('Zůstaly staré role HMP: '+JSON.stringify(stale));
          const commissions=bodies.filter(x=>x.type==='Komise rady');
          const committees=bodies.filter(x=>x.type==='Výbor zastupitelstva');
          const specials=bodies.filter(x=>x.type==='Zvláštní orgán');
          if(commissions.length!==0) throw new Error('Komise P8 mají být 0, je '+commissions.length);
          if(committees.length!==3) throw new Error('Výbory P8 mají být 3, je '+committees.length);
          if(specials.length!==0) throw new Error('Zvláštní orgány P8 mají být 0, je '+specials.length);
          console.log('ZHMP z Prahy 8:',hmp.map(p=>p.name).join(' | '));
          console.log('P8 orgány: 0 komisí · 3 výbory · 0 zvláštních orgánů');
          NODE
      - name: Uložit ověřená data
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lide.json data/organy.json data/source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizovat povolební role a orgány 2026"
          git pull --rebase origin main
          git push origin HEAD:main
