name: "🖼️ Jednorázový import meta obrázků"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-meta-assets.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: "Načíst repozitář"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Stáhnout favicon a náhled"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o ico.ico "https://drive.usercontent.google.com/download?id=1NB0nUkxRbRUK97EOJO6mjSIe-PRzg18C&export=download&confirm=t"
          curl -L --fail --retry 3 -o thumb.jpg "https://drive.usercontent.google.com/download?id=1jpz3m-gD7aYtv1ne_sekbD9ByawS8vw0&export=download&confirm=t"
          test "$(wc -c < ico.ico)" -gt 1000
          test "$(wc -c < thumb.jpg)" -gt 10000
          file ico.ico thumb.jpg
          file ico.ico | grep -qiE 'icon|MS Windows'
          file thumb.jpg | grep -qiE 'JPEG|image data'

      - name: "Uložit obrázky"
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ico.ico thumb.jpg
          if git diff --cached --quiet; then
            echo "Obrázky už jsou aktuální."
            exit 0
          fi
          git commit -m "Přidat favicon a náhledový obrázek"
          git pull --rebase origin main
          git push origin HEAD:main
