name: "🌙 Denní aktualizace"

on:
  workflow_dispatch:
  schedule:
    # 06:00 v Praze po celý rok. GitHub cron běží v UTC, proto máme
    # letní a zimní variantu; níže vybíráme správnou podle offsetu Prahy.
    # 04:00 UTC = 06:00 CEST, 05:00 UTC = 06:00 CET.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  # Stejná skupina jako týdenní synchronizace: v pondělí se běhy provedou
  # postupně a nebudou si současně zapisovat do main.
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "Aktualizovat denní zdroje"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Vybrat správný pražský čas"
        id: prague_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ruční spuštění: časovou podmínku nepoužívám."
            exit 0
          fi

          OFFSET=$(TZ=Europe/Prague date +%z)
          NOW=$(TZ=Europe/Prague date '+%d. %m. %Y %H:%M %Z')
          if [ "$OFFSET" = "+0200" ]; then
            EXPECTED="0 4 * * *"
          else
            EXPECTED="0 5 * * *"
          fi

          echo "Praha při spuštění: $NOW"
          echo "Naplánovaný cron: $EVENT_SCHEDULE | aktivní varianta: $EXPECTED"
          if [ "$EVENT_SCHEDULE" = "$EXPECTED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neaktivní CET/CEST varianta; tento běh se přeskočí."
          fi

      - name: "Načíst repozitář"
        if: steps.prague_time.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Nastavit Node.js"
        if: steps.prague_time.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: "Nainstalovat závislosti"
        if: steps.prague_time.outputs.run == 'true'
        run: npm ci

      - name: "Nainstalovat Chrome pro datový sync"
        if: steps.prague_time.outputs.run == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: "Denní zdroje Prahy 8"
        if: steps.prague_time.outputs.run == 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/sync-praha8.mjs --usneseni-incremental --info106 --noticeboard --news --fast
          node scripts/repair-info106-data.mjs

      - name: "Hlasování ZMČ – nová zasedání"
        if: steps.prague_time.outputs.run == 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:voting

      - name: "Zjistit stav Registru smluv"
        if: steps.prague_time.outputs.run == 'true'
        id: contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=['data/smlouvy.json','data/smlouvy-subjekty.json','data/contract-entities.json','data/contracts-sync-state.json'];
          let ready=files.every(fs.existsSync);
          if(ready){try{const p8=JSON.parse(fs.readFileSync(files[0],'utf8'));const entities=JSON.parse(fs.readFileSync(files[1],'utf8'));const registry=JSON.parse(fs.readFileSync(files[2],'utf8'));const state=JSON.parse(fs.readFileSync(files[3],'utf8'));ready=p8?.meta?.historyComplete===true&&Array.isArray(p8?.contracts)&&entities?.entities?.length===40&&registry?.entities?.length===40&&Object.keys(state?.dumps||{}).length>0}catch{ready=false}}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=${ready}\n`);
          console.log(ready?'Registr smluv: kompletní produkční základ MČ + 40 subjektů nalezen.':'Registr smluv: produkční základ není připraven, inkrementální sync přeskakuji.');
          NODE

      - name: "Registr smluv – nové změny"
        if: steps.prague_time.outputs.run == 'true' && steps.contracts.outputs.ready == 'true'
        run: |
          npm run sync:contracts:new
          node scripts/repair-source-status.mjs contracts

      - name: "Ověřit JSON datasety"
        if: steps.prague_time.outputs.run == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const files=fs.readdirSync('data').filter(f=>f.endsWith('.json'));if(!files.length)throw new Error('Ve složce data nejsou žádné JSON datasety.');
          for(const file of files){const text=fs.readFileSync(path.join('data',file),'utf8');if(!text.trim())throw new Error(`${file} je prázdný.`);JSON.parse(text)}
          console.log(`OK: ověřeno ${files.length} JSON datasetů.`);
          NODE

      - name: "Zjistit změny"
        if: steps.prague_time.outputs.run == 'true'
        id: changes
        run: |
          if git diff --quiet -- data/; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: "Uložit aktualizovaná data"
        if: steps.prague_time.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Denní aktualizace dat"
          for attempt in 1 2 3; do
            echo "Uložení do main: pokus ${attempt}/3"
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "Data se nepodařilo bezpečně uložit ani na třetí pokus."
          exit 1

      - name: "Souhrn"
        if: always()
        run: |
          if [ "${{ steps.prague_time.outputs.run }}" != "true" ]; then
            echo "## ⏭️ Neaktivní CET/CEST varianta přeskočena" >> "$GITHUB_STEP_SUMMARY"
            echo "Druhý UTC cron zajišťuje 06:00 pražského času po celý rok." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" != "success" ]; then
            echo "## ❌ Denní aktualizace selhala" >> "$GITHUB_STEP_SUMMARY"
            echo "Existující data v repozitáři nebyla nahrazena neúspěšným během." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## ✅ Denní aktualizace dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Změněné datasety byly zkontrolovány a uloženy do repozitáře." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Denní kontrola dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Ve sledovaných datech nebyly nalezeny žádné změny." >> "$GITHUB_STEP_SUMMARY"
          fi
