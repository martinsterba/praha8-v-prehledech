name: "🧪 Dotace – ověření historie"
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-grants-history.py"
      - ".github/workflows/grants-history-all-test.yml"
permissions:
  contents: write
concurrency:
  group: grants-history-publish
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Ověřit syntaxi
        run: python3 -m py_compile scripts/sync-grants.py scripts/sync-grants-history.py
      - name: Načíst historii
        run: python3 scripts/sync-grants-history.py
      - name: Ověřit publikovatelná data
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/dotace.json',encoding='utf-8'))
          rows=d['grants']; years={int(g['year']) for g in rows}
          required={2019,2020,2021,2022,2023,2024,2025,2026}
          assert required <= years,(required-years,years)
          counts={y:len([g for g in rows if int(g['year'])==y]) for y in years}
          assert counts.get(2022,0)>=190,counts.get(2022,0)
          assert counts.get(2021,0)>=80,counts.get(2021,0)
          for y in [2016,2017,2018]:
            adult=[g for g in rows if int(g['year'])==y and g.get('area')=='Sport dospělí a dorost']
            assert len(adult)>=20,(y,len(adult))
          for y,min_count in [(2017,10),(2018,13)]:
            micro=[g for g in rows if int(g['year'])==y and g.get('area')=='Zvelebování vzhledu MČ Praha 8']
            assert len(micro)>=min_count,(y,len(micro))
          assert d['meta']['records']>=1200,d['meta']['records']
          print('years',sorted(years,reverse=True),'records',d['meta']['records'])
          print('historyCounts',d['meta'].get('historyCounts'))
          PY
      - name: Uložit data
        run: |
          if git diff --quiet -- data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dotace.json data/grants-ares-cache.json
          git commit -m "Data: zveřejnění ověřené historie dotací"
          git push origin HEAD:main
