name: "🧪 Dotace – historie 2019–2025"
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-grants-history.py"
      - ".github/workflows/grants-history-all-test.yml"
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Ověřit syntaxi
        run: python3 -m py_compile scripts/sync-grants.py scripts/sync-grants-history.py
      - name: Načíst historii
        run: python3 scripts/sync-grants-history.py
      - name: Ověřit ročníky
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/dotace.json',encoding='utf-8'))
          years=set(d['meta']['years'])
          assert set(range(2019,2027)) <= years, years
          for y in range(2019,2026):
            rows=[g for g in d['grants'] if g['year']==y]
            assert len(rows)>=10,(y,len(rows))
            assert {'Kultura','Sportovní výchova mládeže'} <= {g['area'] for g in rows},(y,{g['area'] for g in rows})
          print('years',sorted(years,reverse=True),'records',d['meta']['records'])
          PY
      - name: Uložit data
        run: |
          if git diff --quiet -- data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dotace.json data/grants-ares-cache.json
          git commit -m "Data: dotace 2019–2025"
          git pull --rebase origin main
          git push origin HEAD:main
