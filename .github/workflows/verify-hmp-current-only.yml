name: "Ověřit aktuální funkce HMP"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-hmp-current-only.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Aktualizovat HMP funkce
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:hmp-functions
      - name: Ověřit Radu, výbory a Karolínu
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const people=JSON.parse(fs.readFileSync('data/lide.json','utf8'));
          const bodies=JSON.parse(fs.readFileSync('data/organy.json','utf8'));
          const hana=people.find(x=>/Novotná Hana/i.test(x.name||''));
          if(!(hana?.magistrateRoles||[]).some(r=>/náměstkyně primátora/i.test(r.role||''))) throw new Error('Hana nemá funkci náměstkyně primátora.');
          const kar=people.find(x=>/Gattermayerová Karolína/i.test(x.name||''));
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(mgr|bc|ing|phdr|judr|rndr|mvdr|mga|doc|prof|phd|mba|mpa|ma|dis|csc|dba|bca|et)\.?\b/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).sort().join(' ');
          const k=norm(kar.name);
          const memberships=bodies.filter(o=>[o.chair,...(o.members||[]),...(o.citizens||[])].filter(Boolean).some(m=>norm(m.name)===k));
          if(!memberships.some(o=>/Komise pro kulturu/i.test(o.name))) throw new Error('Karolíně se nespárovala Komise pro kulturu.');
          const committees=people.flatMap(p=>(p.magistrateRoles||[]).filter(r=>/Výbor/i.test(r.body||'')).map(r=>({name:p.name,role:r.role,body:r.body})));
          console.log('HANA',JSON.stringify(hana.magistrateRoles));
          console.log('KAROLINA',memberships.map(x=>x.name).join(' | '));
          console.log('VYBORY_HMP',committees.length);
          committees.forEach(r=>console.log(r.name,'|',r.role,'|',r.body));
          NODE
      - name: Uložit data
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lide.json data/source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizovat aktuální funkce HMP"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
