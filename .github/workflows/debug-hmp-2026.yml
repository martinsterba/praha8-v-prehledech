name: "Diagnostika HMP po volbách 2026"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-hmp-2026.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Porovnat zastupitele Prahy 8 s HMP
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const people=JSON.parse(fs.readFileSync('data/lide.json','utf8'));
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(mgr|bc|ing|phdr|judr|rndr|mudr|mvdr|doc|prof|phd|mba|mpa|dis|ma|bca|et)\.?\b/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
          const variants=name=>{const t=norm(name).split(' ').filter(Boolean);return t.length>=2?[t[0]+' '+t[1],t[1]+' '+t[0]]:[]};
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.PUPPETEER_EXECUTABLE_PATH,args:['--no-sandbox']});
          const page=await browser.newPage();
          async function read(url){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            for(let i=0;i<8;i++){await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));await new Promise(r=>setTimeout(r,700));}
            return await page.evaluate(()=>(document.querySelector('main')||document.body).innerText);
          }
          const z=norm(await read('https://praha.eu/zastupitelstvo'));
          const r=norm(await read('https://praha.eu/rada'));
          const hit=(text,p)=>variants(p.name).some(v=>text.includes(v));
          console.log('=== ZHMP Z PRAHY 8 ===');
          for(const p of people)if(hit(z,p))console.log(p.name+' | '+p.club);
          console.log('=== RHMP Z PRAHY 8 ===');
          for(const p of people)if(hit(r,p))console.log(p.name+' | '+p.club);
          console.log('=== TEXT LENGTH ===',z.length,r.length);
          await browser.close();
          NODE
