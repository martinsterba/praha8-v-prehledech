name: "Diagnostika živé stránky výborů"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-committees.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Vypsat text stránky výborů
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.PUPPETEER_EXECUTABLE_PATH,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://www.praha8.cz/Vybory-zastupitelstva-Mestske-casti-Praha-8.html',{waitUntil:'domcontentloaded',timeout:30000});
          const lines=await page.evaluate(()=>(document.querySelector('main')||document.body).innerText.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean));
          lines.forEach((x,i)=>{if(i<220)console.log(String(i).padStart(3,'0')+': '+x)});
          await browser.close();
          NODE
