name: "Jednorázová aktualizace orgánů po volbách 2026"\n# retest dynamického parseru 3 výborů

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-bodies-2026.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Aktualizovat komise a výbory
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:bodies
      - name: Ověřit povolební stav
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('data/organy.json','utf8'));
          const commissions=rows.filter(x=>x.type==='Komise rady');
          const committees=rows.filter(x=>x.type==='Výbor zastupitelstva');
          const specials=rows.filter(x=>x.type==='Zvláštní orgán');
          if(commissions.length!==0) throw new Error('Komise mají být do ustavení prázdné, načteno: '+commissions.length);
          if(committees.length!==3) throw new Error('Výbory nejsou kompletní: '+committees.length+'/3');
          const expected=['Kontrolní výbor','Finanční výbor','Výbor pro rozpočtové a dotační vztahy s MHMP'];
          for(const name of expected) if(!committees.some(x=>x.name===name)) throw new Error('Chybí '+name);
          for(const x of committees){
            if(!x.chair) throw new Error(x.name+' nemá předsedu.');
            console.log(x.name+': '+x.chair.name+' · členů '+(x.members||[]).length+' · občanů '+(x.citizens||[]).length);
          }
          console.log('OK: 0 komisí · 3 výbory · '+specials.length+' zvláštní orgány');
          NODE
      - name: Uložit data
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/organy.json data/source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizovat výbory po volbách 2026"
          git pull --rebase origin main
          git push origin HEAD:main
