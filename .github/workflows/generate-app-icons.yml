name: 🎨 Vygenerovat ikony webové aplikace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ikona-iphone.svg'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nainstalovat ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Vygenerovat PNG ikony ze SVG
        run: |
          convert -background none ikona-iphone.svg -resize 180x180 apple-touch-icon.png
          convert -background none ikona-iphone.svg -resize 192x192 icon-192.png
          convert -background none ikona-iphone.svg -resize 512x512 icon-512.png

      - name: Uložit ikony
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Vygenerovat ostré ikony webové aplikace ze SVG"
          git pull --rebase origin main
          git push
