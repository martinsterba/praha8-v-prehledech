name: "Diagnostika ZHMP z voleb 2026"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-zhmp-election-2026.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Porovnat zvolené do ZHMP s Prahou 8
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const people=JSON.parse(fs.readFileSync('data/lide.json','utf8'));
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(mgr|bc|ing|phdr|judr|rndr|mudr|mvdr|doc|prof|phd|mba|mpa|dis|ma|bca|et)\.?\b/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
          const key=s=>norm(s).split(' ').filter(Boolean).slice(0,2).sort().join(' ');
          const urls=[
            'https://volby.gov.cz/appdata/kv2026/20261009/odata/zastup/vysledky_obec_554782.xml',
            'https://volby.gov.cz/appdata/kv2026/20261009/odata/zastup/vysledky_obec_500054.xml'
          ];
          let xml='';
          for(const url of urls){
            const r=await fetch(url);
            console.log('URL',url,'status',r.status);
            if(r.ok){xml=await r.text();console.log('length',xml.length,'head',xml.slice(0,120));if(!/<CHYBA\b/i.test(xml))break;}
          }
          if(!xml) throw new Error('Nepodařilo se načíst volební XML pro HMP.');
          const elected=[];
          for(const m of xml.matchAll(/<ZASTUPITEL\b([^>]*)>/g)){
            const attrs=Object.fromEntries([...m[1].matchAll(/([A-Za-z0-9_:-]+)=["']([^"']*)["']/g)].map(x=>[x[1].toUpperCase(),x[2]]));
            const name=((attrs.JMENO||'')+' '+(attrs.PRIJMENI||'')).trim();
            if(name)elected.push(name);
          }
          console.log('Zvolených v XML:',elected.length);
          const ekeys=new Set(elected.map(key));
          console.log('=== SHODY PRAHA 8 / ZHMP ===');
          for(const p of people)if(ekeys.has(key(p.name)))console.log(p.name+' | '+p.club);
          NODE
