name: "Ověřit bezpečnou aktualizaci npm"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-dependency-fix.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Aktualizovat zranitelné závislosti bez force
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          node --input-type=module -e "import puppeteer from 'puppeteer-core'; if (!puppeteer.launch) process.exit(1)"
          echo 'LOCKFILE_START'
          cat package-lock.json
          echo 'LOCKFILE_END'
          git diff -- package.json
