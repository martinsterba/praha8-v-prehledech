name: "🧪 Dotace – historie 2025"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-history-test.yml"
      - "scripts/sync-grants-history.py"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ověřit syntaxi
        run: python3 -m py_compile scripts/sync-grants.py scripts/sync-grants-history.py
      - name: Načíst rok 2025
        run: python3 scripts/sync-grants-history.py
      - name: Ověřit dataset
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/dotace.json',encoding='utf-8'))
          assert 2025 in d['meta']['years'], d['meta']['years']
          y=[g for g in d['grants'] if g['year']==2025]
          assert len(y)>=20, len(y)
          assert {'Kultura','Volnočasové aktivity dětí a mládeže','Sportovní výchova mládeže','Sociální oblast'} <= {g['area'] for g in y}
          print('2025:',len(y),'celkem:',d['meta']['records'])
          PY
      - name: Uložit aktualizovaná data
        shell: bash
        run: |
          if git diff --quiet -- data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dotace.json data/grants-ares-cache.json
          git commit -m "Data: doplnění dotací 2025"
          git pull --rebase origin main
          git push origin HEAD:main
