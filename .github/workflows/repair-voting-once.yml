name: 🛠 Oprava hlasovacích dat

on:
  push:
    paths:
      - 'scripts/repair-voting-data.mjs'
      - 'scripts/repair-voting-matches.mjs'
      - '.github/workflows/repair-voting-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nastavit Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Nainstalovat závislosti
        run: npm ci

      - name: Opravit jména v hlasovacích datech
        run: node scripts/repair-voting-data.mjs

      - name: Doplnit bezpečné párování s usneseními
        run: node scripts/repair-voting-matches.mjs

      - name: Ověřit, že názvy stran nejsou vydávány za osoby
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/hlasovani.json','utf8'));
          const re=/(Česká pirátská strana|SPD a Trikolora pro Osmičku)/i;
          const bad=rows.flatMap(v=>(v.votes||[]).filter(x=>re.test(x.name||'')).map(x=>`${v.date} #${v.number}: ${x.name}`));
          console.log(`Podezřelých jmen: ${bad.length}`);
          if(bad.length){console.error(bad.slice(0,20).join('\n'));process.exit(1)}
          NODE

      - name: Uložit opravená data
        run: |
          if git diff --quiet -- data/; then
            echo 'Hlasovací data už nevyžadují změnu.'
            exit 0
          fi
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Opravit historická hlasovací data"
          git pull --rebase origin main
          git push origin HEAD:main
