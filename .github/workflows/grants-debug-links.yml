name: "🧭 Dotace – debug odkazů"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-debug-links.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prozkoumat problematické zdroje
        run: |
          python3 - <<'PY'
          import importlib.util,subprocess,tempfile,urllib.request
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('base','scripts/sync-grants.py')
          base=importlib.util.module_from_spec(spec); spec.loader.exec_module(base)

          print('### SOCIAL 2022 XLSX')
          page='https://www.praha8.cz/appo/usn/676?usn=LFMBDOBTy5eWHsComlKmZw%3D%3D'
          p=base.LinkParser(); p.feed(base.fetch_text(page))
          for href,text in p.links:
            if '.xlsx' not in (href+' '+text).lower(): continue
            from urllib.parse import urljoin
            url=urljoin(page,href)
            print('FILE',text,url)
            try:
              rows=base.xlsx_rows(base.fetch_bytes(url))
              for i,row in enumerate(rows[:25]): print(i+1,repr(row))
            except Exception as e: print('XLSX ERROR',repr(e))

          for year,url in [
            (2017,'https://www.praha8.cz/file/TRy/Vysledky-mikrogranty-zvelebovani-2017.pdf'),
            (2018,'https://www.praha8.cz/file/hCY/Vysledky-mikrogranty-zvelebovani-2018.pdf')]:
            print('\n### MICROGRANT PDF',year)
            try:
              blob=base.fetch_bytes(url)
              with tempfile.TemporaryDirectory() as td:
                pdf=Path(td)/'in.pdf'; txt=Path(td)/'out.txt'; pdf.write_bytes(blob)
                r=subprocess.run(['pdftotext','-layout',str(pdf),str(txt)],capture_output=True,text=True)
                print('pdftotext rc',r.returncode,r.stderr[:500])
                if txt.exists(): print(txt.read_text(encoding='utf-8',errors='replace')[:16000])
            except Exception as e: print('PDF ERROR',repr(e))
          PY
