name: "🧭 Dotace – debug odkazů"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-debug-links.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prozkoumat problematické tabulky
        run: |
          python3 - <<'PY'
          import importlib.util
          from urllib.parse import urljoin
          spec=importlib.util.spec_from_file_location('base','scripts/sync-grants.py')
          base=importlib.util.module_from_spec(spec); spec.loader.exec_module(base)
          pages=[
            ('Kultura 2019','https://www.praha8.cz/Granty-Kultura-2019'),
            ('Kultura 2021','https://www.praha8.cz/Granty-Kultura-2021'),
            ('Volnočas 2021','https://www.praha8.cz/Granty-Volnocasove-nesportovni-aktivity-2020-1'),
          ]
          for title,page in pages:
            print('\n###',title,page)
            p=base.LinkParser(); p.feed(base.fetch_text(page))
            for href,text in p.links:
              low=(href+' '+text).lower()
              if '.xls' not in low and '.xlsx' not in low: continue
              url=urljoin(page,href)
              print('FILE',text,'=>',url)
              if '.xlsx' in low:
                try:
                  rows=base.xlsx_rows(base.fetch_bytes(url))
                  for i,row in enumerate(rows[:35]): print(i+1,repr(row))
                except Exception as e: print('ERROR',repr(e))
          PY
