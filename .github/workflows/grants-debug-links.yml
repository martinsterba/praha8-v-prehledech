name: "🧭 Dotace – debug odkazů"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-debug-links.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prozkoumat zbývající historický archiv
        run: |
          python3 - <<'PY'
          import importlib.util,shutil
          from urllib.parse import urljoin
          spec=importlib.util.spec_from_file_location('base','scripts/sync-grants.py')
          base=importlib.util.module_from_spec(spec); spec.loader.exec_module(base)
          pages=[
            ('Kultura a volnočas 2009–2018','https://www.praha8.cz/2009-2018'),
            ('Sociální 2008–2018','https://www.praha8.cz/Dotace-2008-2018'),
            ('Sport dospělí 2015','https://www.praha8.cz/Granty-Sport-pro-dospele-a-dorost-2015'),
            ('Sport dospělí 2014','https://www.praha8.cz/Granty-Telovychovna-cinnost-dospelych-2014'),
            ('Kultura 2019','https://www.praha8.cz/Granty-Kultura-2019'),
          ]
          print('TOOLS', {x:shutil.which(x) for x in ['antiword','catdoc','libreoffice','soffice','pdftotext','xls2csv']})
          for title,page in pages:
            print('\n###',title,page)
            try:
              p=base.LinkParser(); p.feed(base.fetch_text(page))
              for href,text in p.links:
                full=urljoin(page,href); low=(text+' '+full).lower()
                if any(ext in low for ext in ['.xls','.xlsx','.doc','.docx','.pdf']) or any(k in low for k in ['grant','dotac','výsled','vysled','podpořen','podporen']):
                  print(text,'=>',full)
            except Exception as e: print('ERROR',repr(e))
          PY
