name: "💶 Dotace – týdenní aktualizace"

on:
  workflow_dispatch:
  # Dočasný jednorázový retest po normalizaci IČ v historických názvech příjemců.
  # Po zeleném průchodu se tento push trigger odstraní.
  push:
    branches: [main]
    paths:
      - ".github/workflows/grants-sync.yml"
  schedule:
    # Pondělí 05:37 UTC = 07:37 v Praze v letním čase.
    # Běží až po denní a běžné týdenní synchronizaci.
    - cron: "37 5 * * 1"

permissions:
  contents: write

concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  grants:
    name: "Aktualizovat dotace a granty"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Rozhodnout, zda dnes synchronizovat"
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          prague_date="$(TZ=Europe/Prague date +%F)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$prague_date" = "2026-09-07" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Dnešní automatický běh je záměrně přeskočen; první plánovaný grantový sync bude 14. 9. 2026."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Načíst repozitář"
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Nainstalovat podporu starých grantových formátů"
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check xlrd==2.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword catdoc

      - name: "Ověřit syntaxi grantových importérů"
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 -m py_compile \
            scripts/sync-grants.py \
            scripts/sync-grants-current-safe.py \
            scripts/sync-grants-history.py \
            scripts/sync-grants-social-modern.py \
            scripts/sync-grants-resolution-programs.py \
            scripts/sync-grants-archive.py \
            scripts/sync-grants-archive-social-legacy.py \
            scripts/sync-grants-sport-legacy.py \
            scripts/sync-grants-archive-culture.py \
            scripts/normalize-grant-recipients.py \
            scripts/sync-grants-individual.py \
            scripts/validate-grants.py

      - name: "Spustit kompletní grantový pipeline"
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:grants

      - name: "Ověřit výsledný JSON"
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('data/dotace.json',encoding='utf-8'))
          assert isinstance(p.get('grants'),list)
          assert p.get('meta',{}).get('records')==len(p['grants'])
          print('Dotace:',len(p['grants']))
          print('Roky:',p.get('meta',{}).get('years'))
          print('Oblasti:',p.get('meta',{}).get('areas'))
          print('Moderní sociální archiv:',p.get('meta',{}).get('modernSocialLoadedYears',[]))
          print('Starý sport:',p.get('meta',{}).get('legacySportLoadedYears',[]))
          print('Archiv:',p.get('meta',{}).get('archiveLoadedKeys',[]))
          print('Starý sociální archiv:',p.get('meta',{}).get('legacySocialLoadedYears',[]))
          print('Archiv kultura:',p.get('meta',{}).get('archiveCultureLoadedKeys',[]))
          print('Z usnesení:',p.get('meta',{}).get('resolutionProgramLoadedKeys',[]))
          print('Mimořádné dotace:',p.get('meta',{}).get('extraordinaryRows',0),'bezpečně vytěžených;',p.get('meta',{}).get('extraordinaryUnmatched',0),'nevyřešených')
          print('Normalizace IČ v názvech:',p.get('meta',{}).get('recipientIcoNormalized',0),'záznamů')
          for year in (2015,2016,2017):
            rows=[g for g in p['grants'] if int(g.get('year') or 0)==year and g.get('area')=='Kultura a volnočasové aktivity']
            print(f'Kultura/volnočas {year}: {len(rows)} záznamů, {round(sum(float(g.get("approvedCzk") or 0) for g in rows)):,} Kč')
          bad=[g for g in p['grants'] if '|' in str(g.get('recipient') or '') or 'součet' in str(g.get('recipient') or '').casefold() or 'soucet' in str(g.get('recipient') or '').casefold()]
          assert not bad, f'Poškození příjemci stále v datech: {bad[:5]}'
          PY

      - name: "Zjistit změny"
        if: steps.gate.outputs.run == 'true'
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: "Uložit ověřená data"
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generovaný JSON nerebasujeme. Pokud během běhu někdo posunul main,
          # vezmeme nový stav a celý deterministický grantový pipeline spustíme
          # znovu nad ním. Tím se vyhneme konfliktům v data/dotace.json a nikdy
          # nepřepíšeme novější data starším výstupem.
          for attempt in 1 2 3; do
            git fetch origin main
            local_sha="$(git rev-parse HEAD)"
            remote_sha="$(git rev-parse origin/main)"
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "Main se během běhu změnil; přepočítávám dotace nad nejnovějším stavem (pokus $attempt/3)."
              git reset --hard origin/main
              npm run sync:grants
              python3 scripts/validate-grants.py
            fi

            git add data/dotace.json data/grants-ares-cache.json
            if git diff --cached --quiet; then
              echo "Po přepočtu není co ukládat."
              exit 0
            fi
            git commit -m "Týdenní aktualizace dotací"
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Main se změnil těsně před push; opakuji z nového základu."
              git fetch origin main
              git reset --hard origin/main
              npm run sync:grants
              python3 scripts/validate-grants.py
              sleep 3
            fi
          done
          exit 1

      - name: "Souhrn"
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.run }}" = "false" ]; then
            echo "## ⏭️ Dotace dnes záměrně přeskočeny" >> "$GITHUB_STEP_SUMMARY"
            echo "Automatický běh 7. 9. 2026 je vypnutý; první další plánovaný sync je 14. 9. 2026." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" != "success" ]; then
            echo "## ❌ Aktualizace dotací selhala" >> "$GITHUB_STEP_SUMMARY"
            echo "Produkční dotace nebyly nahrazeny neověřenými daty. Ostatní denní a týdenní synchronizace jsou na tomto workflow nezávislé." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## ✅ Dotace byly aktualizovány" >> "$GITHUB_STEP_SUMMARY"
            echo "Nový dataset prošel QA a byl uložen do main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Kontrola dotací dokončena" >> "$GITHUB_STEP_SUMMARY"
            echo "Dataset prošel QA, ale nebylo co měnit." >> "$GITHUB_STEP_SUMMARY"
          fi
