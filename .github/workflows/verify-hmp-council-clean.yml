name: "Ověřit čisté role Rady HMP"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-hmp-council-clean.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Aktualizovat funkce HMP
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run sync:hmp-functions
      - name: Ověřit Tomáše Slabihoudka
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const people=JSON.parse(fs.readFileSync('data/lide.json','utf8'));
          const p=people.find(x=>/Slabihoudek Tomáš/i.test(x.name||''));
          const roles=p?.magistrateRoles||[];
          const generic=roles.filter(r=>/^(radní hl\. města Prahy|radní)$/i.test(String(r.role||'').trim()) && !String(r.body||'').trim());
          const specific=roles.filter(r=>/^(radní hl\. města Prahy|radní)$/i.test(String(r.role||'').trim()) && String(r.body||'').trim());
          if(generic.length) throw new Error('Vrátila se obecná stará role radního: '+JSON.stringify(generic));
          if(specific.length!==1) throw new Error('Očekávám právě jednu přesnou roli radního s gescí, mám '+specific.length);
          console.log(JSON.stringify(roles,null,2));
          NODE
      - name: Uložit případná data
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lide.json data/source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ověřit aktuální role Rady HMP"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
