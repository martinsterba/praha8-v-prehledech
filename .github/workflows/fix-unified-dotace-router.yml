name: "Jednorázově sjednotit router Dotací"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-unified-dotace-router.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Sjednotit Dotace s hlavní aplikací"
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch_dotace.py
          python3 /tmp/patch_dotace.py
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-unified-dotace-router.yml
          git add app.js grants-module.js index.html
          git commit -m "Sjednotit Dotace s hlavním routerem webu"
          git push origin HEAD:main
