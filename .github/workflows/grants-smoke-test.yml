name: 🧪 Test importu dotací

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-grants.py
      - .github/workflows/grants-smoke-test.yml

permissions:
  contents: write

jobs:
  grants-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import dotací
        run: python3 scripts/sync-grants.py

      - name: QA výstupu
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/dotace.json')
          if not p.exists(): raise SystemExit('data/dotace.json nevznikl')
          d=json.loads(p.read_text(encoding='utf-8'))
          grants=d.get('grants',[])
          if len(grants)<10: raise SystemExit(f'Podezřele málo záznamů: {len(grants)}')
          required={'Kultura','Volnočasové aktivity dětí a mládeže','Sportovní výchova mládeže'}
          areas={g.get('area') for g in grants}
          missing=required-areas
          if missing: raise SystemExit('Chybí oblasti: '+', '.join(sorted(missing)))
          bad=[g for g in grants if not g.get('recipient') or not isinstance(g.get('approvedCzk'),(int,float)) or g.get('approvedCzk',0)<=0]
          if bad: raise SystemExit(f'Neplatné záznamy: {len(bad)}')
          if any(g.get('ico')=='00000000' for g in grants): raise SystemExit('Dataset obsahuje IČ 00000000')
          print(f'QA OK: {len(grants)} záznamů · oblasti: {", ".join(sorted(areas))}')
          PY

      - name: Uložit první dataset
        run: |
          set -euo pipefail
          git config user.name "Praha 8 v přehledech – automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dotace.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Přidat první dataset dotací"
          git pull --rebase origin main
          git push origin HEAD:main
